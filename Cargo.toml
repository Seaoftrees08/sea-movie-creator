[package]
name = "sea-movie-creator"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "AI-native lightweight movie editor built with Rust"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
cpal = "0.18.2"
gpui-kit = "0.9.1"
image = "0.25"
matroska-demuxer = "0.8.1"
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
rubato = "5.1.0"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1.13"
symphonia = { version = "0.6.1", features = ["all-codecs", "all-formats"] }
thiserror = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[dev-dependencies]
rav1e = { version = "0.8.1", default-features = false, features = ["threading"] }

[profile.dev.package.rav1d]
opt-level = 2

[profile.dev.package.rav1e]
opt-level = 2

[lints.rust]
unsafe_code = "deny"
unused = { level = "deny", priority = -1 }
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_mut = "deny"
unused_must_use = "deny"
unreachable_code = "deny"
deprecated = "deny"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
module_name_repetitions = "allow"
