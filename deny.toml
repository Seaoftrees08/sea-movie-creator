# cargo-deny configuration for sea-movie-creator
# Checks RustSec advisories, SPDX license allowlist, crate bans, and dependency sources.

[graph]
all-features = true
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[advisories]
yanked = "warn"
unmaintained = "workspace"
ignore = [
    { id = "RUSTSEC-2026-0194", reason = "Linux AT-SPI 経由 (gpui-kit -> accesskit_unix -> atspi -> zbus_xml 5.1.0) の推移的依存であり、zbus_xml が quick-xml ^0.38 を固定しているため。外部 XML 解析には未使用。" },
    { id = "RUSTSEC-2026-0195", reason = "Linux AT-SPI 経由 (gpui-kit -> accesskit_unix -> atspi -> zbus_xml 5.1.0) の推移的依存であり、zbus_xml が quick-xml ^0.38 を固定しているため。外部 XML 解析には未使用。" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
